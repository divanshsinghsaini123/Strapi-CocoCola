name: Gcore Media Backup

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Create Google Service Account File
        run: |
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip jq unzip

          curl https://rclone.org/install.sh | sudo bash

          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = service-account.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Download Complete Gcore Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GCORE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GCORE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.GCORE_REGION }}
        run: |
          mkdir -p media-backup

          aws s3 sync \
            s3://${{ secrets.GCORE_BUCKET_NAME }} \
            ./media-backup \
            --endpoint-url=${{ secrets.GCORE_ENDPOINT }}

      - name: Create Backup Zip
        run: |
          BACKUP_NAME="media-backup-$(date +%Y-%m-%d-%H-%M-%S).zip"

          zip -r "$BACKUP_NAME" media-backup

          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV

      - name: Upload Backup To Google Drive
        run: |
          rclone copy \
            "$BACKUP_NAME" \
            gdrive:

      - name: Keep Only Latest 2 Backups
        run: |
          FILES=$(rclone lsjson gdrive: --files-only | \
            jq -r 'sort_by(.ModTime) | reverse | .[2:][]?.Path')

          for FILE in $FILES
          do
            echo "Deleting old backup: $FILE"
            rclone deletefile "gdrive:$FILE"
          done

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ✅ Gcore Media Backup Completed Successfully
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Gcore media backup completed successfully.

            Bucket:
            ${{ secrets.GCORE_BUCKET_NAME }}

            Backup File:
            ${{ env.BACKUP_NAME }}

            Google Drive Folder:
            https://drive.google.com/drive/u/1/folders/1cD0WGLU_WCemyLqmcwwmowE0avReSUu4

            Retention Policy:
            - Latest 2 backups retained
            - Older backups deleted automatically

            Generated By:
            GitHub Actions Automated Backup Workflow
