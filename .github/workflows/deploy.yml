name: Deploy Backend (Strapi)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy Strapi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Navigating to Strapi directory..."
            cd /root/apps/Strapi-CocoCola
            
            echo "📥 Pulling latest Strapi code..."
            git pull origin ${{ github.ref_name }}
            
            echo "🐳 Rebuilding Strapi container..."
            docker compose up --build -d strapi
            
            echo "🧹 Cleaning up unused images..."
            docker image prune -f
            
            echo "🎉 Strapi Deployment Successful!"
